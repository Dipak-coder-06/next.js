[package]
name = "turbo-bitset"
version = "0.1.0"
description = "A fast bitset over a bounded, block-aligned bit range"
license = "MIT"
edition = "2024"

[lints]
workspace = true

[dependencies]
roaring = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
criterion = { workspace = true }
fixedbitset = { workspace = true }
# The `sizes` example measures the serialized size of `RoaringBitmap` through serde.
roaring = { workspace = true, features = ["serde"] }
rustc-hash = { workspace = true }

[[bench]]
name = "mod"
harness = false
